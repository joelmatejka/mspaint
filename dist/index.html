<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#008080" />
    <meta
      name="description"
      content="Classic Paint, recreated for the web. Switch between Windows 98, XP and Windows 7 and make something pixel by pixel."
    />
    <title>Untitled - Paint</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-theme="98">
    <main id="app" aria-label="Classic Paint">
      <header class="titlebar">
        <img src="icon.svg" width="18" height="18" alt="" />
        <div
          id="quick-access"
          class="quick-access"
          aria-label="Quick access toolbar"
        ></div>
        <span id="window-title">Untitled - Paint</span>
        <div class="era-picker">
          <label for="era">Appearance</label
          ><select id="era" aria-label="Windows appearance">
            <option value="98">Windows 98</option>
            <option value="xp">Windows XP</option>
            <option value="7">Windows 7</option>
          </select>
        </div>
        <div class="window-controls">
          <button
            id="install"
            title="Install as a desktop app"
            aria-label="Install as desktop app"
          >
            ⇩</button
          ><button
            data-action="fullscreen"
            title="Toggle full screen"
            aria-label="Toggle full screen"
          >
            □</button
          ><button
            data-action="about"
            title="About Paint"
            aria-label="About Paint"
          >
            ?
          </button>
        </div>
      </header>
      <nav id="menubar" class="menubar" aria-label="Application menu"></nav>
      <section id="ribbon" class="ribbon" aria-label="Paint ribbon"></section>
      <section class="workarea">
        <aside id="toolbox" class="toolbox" aria-label="Drawing tools">
          <div id="tools" class="tools"></div>
          <div id="tool-options" class="tool-options"></div>
        </aside>
        <div
          id="viewport"
          class="viewport"
          tabindex="0"
          aria-label="Drawing workspace"
        >
          <div id="canvas-wrap" class="canvas-wrap">
            <canvas
              id="canvas"
              width="800"
              height="500"
              aria-label="Drawing canvas"
            ></canvas
            ><canvas
              id="overlay"
              width="800"
              height="500"
              aria-label="Interactive drawing surface"
            ></canvas
            ><textarea
              id="text-editor"
              aria-label="Text to insert"
              spellcheck="false"
            ></textarea
            ><i class="canvas-grip grip-e" data-resize="e"></i
            ><i class="canvas-grip grip-s" data-resize="s"></i
            ><i class="canvas-grip grip-se" data-resize="se"></i>
          </div>
        </div>
      </section>
      <section id="colorbox" class="colorbox" aria-label="Color palette">
        <button
          id="current-colors"
          title="Swap foreground and background colors (X)"
          aria-label="Swap colors"
        >
          <span class="back-color"></span><span class="front-color"></span>
        </button>
        <div id="palette" class="palette"></div>
        <button class="edit-colors" data-action="colors" title="Edit colors">
          <span class="color-spectrum"></span><span>Edit colors</span>
        </button>
        <div class="palette-note">
          Left click: foreground<br />Right click: background
        </div>
      </section>
      <footer id="statusbar" class="statusbar">
        <span id="status" role="status"
          >For Help, click Help Topics on the Help Menu.</span
        ><span id="position">0, 0 px</span
        ><span id="dimensions">800 × 500 px</span>
        <div class="zoom-controls">
          <button id="zoom-out" aria-label="Zoom out">−</button
          ><button id="zoom-label" data-action="zoom">100%</button
          ><input
            id="zoom-slider"
            type="range"
            min="0"
            max="7"
            value="2"
            aria-label="Zoom"
          /><button id="zoom-in" aria-label="Zoom in">+</button>
        </div>
        <span class="size-grip">◢</span>
      </footer>
    </main>
    <div id="menu-root"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <input id="open-file" type="file" accept="image/*,.bmp" hidden />
    <div id="toast" role="status"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
